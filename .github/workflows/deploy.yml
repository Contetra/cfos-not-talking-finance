name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: /home/deploy/bin/release.sh contetra-cfos-not-talking-finance github.com-cfos Contetra/cfos-not-talking-finance 3003
