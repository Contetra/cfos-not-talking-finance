# Installed at /etc/nginx/sites-available/cfosnottalkingfinance, then symlinked into sites-enabled.
# After certbot runs, it adds the 443 block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cfosnottalkingfinance.com www.cfosnottalkingfinance.com;

    client_max_body_size 100M;

    location /_next/static/ {
        alias /home/deploy/apps/contetra-cfos-not-talking-finance/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
